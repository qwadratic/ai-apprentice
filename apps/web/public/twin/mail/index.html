<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Northwind Mail</title>
  <!--
    Northwind Mail: a digital twin of an everyday mail client, for the Clipa demo. Open it in its own tab and share that tab like
    any real app. Self-contained (no framework, no network, nothing stored); all names, addresses and numbers are synthetic;
    Send is simulated and sends nothing. Cases: ?case=a|b|c|d (see twin.js).
  -->
  <link rel="stylesheet" href="./twin.css">
</head>
<body>
  <div class="app" id="app" data-view="inbox">
    <header class="topbar">
      <a class="brand" href="./index.html" id="brand" aria-label="Northwind Mail, back to the inbox">
        <svg class="brand__mark" viewBox="0 0 48 48" width="44" height="44" aria-hidden="true" focusable="false">
          <circle cx="24" cy="24" r="22" fill="#16324f"/>
          <path d="M24 6l6 18-6 18-6-18z" fill="#f2b441"/>
          <path d="M6 24l18-6 18 6-18 6z" fill="#8fb8e8"/>
          <circle cx="24" cy="24" r="3.4" fill="#16324f"/>
        </svg>
        <span class="brand__name">Northwind <span class="brand__light">Mail</span></span>
      </a>
      <label class="search">
        <span class="sr">Search mail</span>
        <input type="search" id="search" placeholder="Search mail" autocomplete="off" spellcheck="false">
      </label>
      <div class="casebox" title="Twin control: loads a ready-made draft. It is not part of the mail client.">
        <label for="case-select">Twin case</label>
        <select id="case-select" data-field="case"></select>
      </div>
    </header>

    <nav class="rail" aria-label="Folders">
      <button type="button" class="btn btn--primary btn--compose" id="compose-new" data-action="compose">Compose</button>
      <ul class="folders" id="folders">
        <li><button type="button" class="folder" data-folder="inbox"><span>Inbox</span><span class="folder__count" id="count-inbox"></span></button></li>
        <li><button type="button" class="folder" data-folder="drafts"><span>Drafts</span><span class="folder__count" id="count-drafts"></span></button></li>
        <li><button type="button" class="folder" data-folder="sent"><span>Sent</span><span class="folder__count" id="count-sent"></span></button></li>
      </ul>
    </nav>

    <main class="main" id="main">
      <!-- Inbox, Drafts and Sent: a list and a reading pane. -->
      <section class="mailbox" id="view-list" aria-label="Messages">
        <div class="list" id="list-pane">
          <h1 class="list__title" id="list-title">Inbox</h1>
          <ul class="messages" id="messages"></ul>
        </div>
        <article class="reader" id="reader" aria-live="polite"></article>
      </section>

      <!-- Compose: the draft. -->
      <section class="compose" id="view-compose" aria-label="Draft" hidden>
        <div class="compose__head">
          <h1 class="compose__title" id="compose-title">New message</h1>
          <button type="button" class="btn btn--quiet" id="discard" data-action="discard">Discard</button>
        </div>
        <div class="field">
          <label class="field__label" for="field-to">To</label>
          <input class="field__input" type="text" id="field-to" data-field="to" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label class="field__label" for="field-subject">Subject</label>
          <input class="field__input" type="text" id="field-subject" data-field="subject" autocomplete="off">
        </div>
        <div class="field field--body">
          <label class="field__label" for="field-body">Message</label>
          <textarea class="field__input field__input--body" id="field-body" data-field="body" rows="9" spellcheck="false"></textarea>
        </div>
        <div class="attach" id="attach-row" aria-label="Attachments">
          <span class="attach__label">Attachments</span>
          <ul class="chips" id="chips"></ul>
          <button type="button" class="btn btn--quiet" id="attach-add" data-action="attach">Attach a file</button>
        </div>
        <div class="actions">
          <button type="button" class="btn btn--primary btn--big" id="send" data-action="send">Send</button>
          <button type="button" class="btn btn--big" id="preview" data-action="preview">Preview</button>
          <span class="actions__hint" id="send-hint">Sending is simulated: nothing leaves this page.</span>
        </div>
      </section>
    </main>

    <footer class="footer">Digital twin · synthetic data</footer>
  </div>

  <!-- Preview of the draft: how the message will look. -->
  <div class="overlay" id="overlay-preview" role="dialog" aria-modal="true" aria-labelledby="preview-title" hidden>
    <div class="sheet">
      <h2 class="sheet__title" id="preview-title">Preview</h2>
      <dl class="sheet__meta">
        <div><dt>To</dt><dd id="preview-to"></dd></div>
        <div><dt>Subject</dt><dd id="preview-subject"></dd></div>
      </dl>
      <div class="sheet__body" id="preview-body"></div>
      <p class="sheet__attach" id="preview-attach"></p>
      <div class="actions">
        <button type="button" class="btn btn--primary btn--big" id="preview-send" data-action="send-from-preview">Send</button>
        <button type="button" class="btn btn--big" id="preview-back" data-action="back-to-edit">Back to edit</button>
      </div>
    </div>
  </div>

  <!-- A look at an image attachment. -->
  <div class="overlay" id="overlay-image" role="dialog" aria-modal="true" aria-labelledby="image-title" hidden>
    <div class="sheet sheet--image">
      <h2 class="sheet__title" id="image-title">delivery-summary.png</h2>
      <div class="picture" id="picture" role="img" aria-label="The attached image: a delivery summary card"></div>
      <div class="actions">
        <button type="button" class="btn btn--big" id="image-close" data-action="close-image">Close</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="./twin.js"></script>
</body>
</html>
