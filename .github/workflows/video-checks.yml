name: video-checks

# The video toolkit in video/ is a standalone package (not a root workspace member), so it has its own
# check. It only type-checks: rendering needs a browser and takes minutes, so it is run by hand
# (see video/README.md).
on:
  push:
    branches-ignore: [main]
    paths:
      - "video/**"
      - ".github/workflows/video-checks.yml"
  pull_request:
    paths:
      - "video/**"
      - ".github/workflows/video-checks.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and type-check video/
        run: |
          set -euo pipefail
          cd video
          npm ci
          npm run typecheck
