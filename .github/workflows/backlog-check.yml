name: backlog-check

# Callable (workflow_call, used by release.yml on pushes to release), manual (workflow_dispatch),
# and on pull_request into release for backlog/**. No push trigger here: a push to release runs
# release.yml, which calls this workflow already, so a separate push trigger would just duplicate
# that run.
on:
  pull_request:
    branches: [release]
    paths:
      - "backlog/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to check (default is the selected branch)"
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Commit to check (default is the triggering commit)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  unique-task-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Task IDs are unique
        run: |
          shopt -s nullglob
          files=(backlog/tasks/*.md backlog/completed/*.md)
          if [ ${#files[@]} -eq 0 ]; then echo "No tasks yet."; exit 0; fi
          dups=$(grep -h -m1 -i '^id:' "${files[@]}" | tr -d "\"' " | tr '[:lower:]' '[:upper:]' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "Duplicate task IDs (two branches created the same number):"
            echo "$dups"
            echo "Repair on main with: backlog doctor --fix"
            exit 1
          fi
          echo "All ${#files[@]} task IDs are unique."
