name: macos-build

on:
  push:
    branches: [release]
    paths:
      - "mac/**"
      - ".github/workflows/macos-build.yml"
  pull_request:
    branches: [release]
    paths:
      - "mac/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Run unit tests
        run: swift test

      - name: Build Clipa.app (release, ad-hoc signed, universal arm64+x86_64)
        env:
          UNIVERSAL: "1"
        run: ./scripts/build-app.sh

      # UNIVERSAL=1 (above) asks swift build for both slices; fail loudly if either did not actually land in the
      # binary (e.g. a toolchain that silently falls back to one arch).
      - name: Verify the universal binary (lipo)
        run: |
          archs="$(lipo -archs build/Clipa.app/Contents/MacOS/Clipa)"
          echo "Clipa.app/Contents/MacOS/Clipa architectures: $archs"
          echo "$archs" | tr ' ' '\n' | grep -qx arm64 || { echo "::error::universal build is missing arm64 (got: $archs)"; exit 1; }
          echo "$archs" | tr ' ' '\n' | grep -qx x86_64 || { echo "::error::universal build is missing x86_64 (got: $archs)"; exit 1; }

      - name: Zip the app
        run: ditto -c -k --keepParent build/Clipa.app build/Clipa-macos.zip

      # The usual Mac download: open the disk image and drag Clipa onto the Applications shortcut next to it.
      - name: Disk image (drag Clipa to Applications)
        run: |
          rm -rf build/dmg && mkdir -p build/dmg
          ditto build/Clipa.app build/dmg/Clipa.app
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Clipa -srcfolder build/dmg -ov -format UDZO build/Clipa.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clipa-macos
          path: mac/build/Clipa-macos.zip
          if-no-files-found: error

      # Pushes to release publish the app as one fixed public release, so the download links never change:
      # https://github.com/qwadratic/clipa/releases/download/clipa-macos-latest/Clipa.dmg (and Clipa-macos.zip)
      - name: Publish the latest release-branch build as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete clipa-macos-latest --yes --cleanup-tag || true
          gh release create clipa-macos-latest build/Clipa.dmg build/Clipa-macos.zip \
            --title "Clipa for macOS (latest release-branch build)" --target "$GITHUB_SHA" \
            --notes "Ad-hoc signed universal (arm64 + x86_64) build of mac/ at $GITHUB_SHA, not notarized. Open Clipa.dmg and drag Clipa to Applications. First launch: macOS blocks it; open System Settings > Privacy & Security and click Open Anyway (once). Then grant Screen Recording, Microphone and Input Monitoring. From Terminal instead: curl -fsSL https://raw.githubusercontent.com/qwadratic/clipa/main/mac/scripts/install.sh | bash"

      # The smoke steps below need the live Clipa server; on a push to release or a manual run, check it is actually
      # up before relying on it, and skip (not fail the build) when it is not reachable right now.
      - name: Check the Clipa server is reachable (the smoke steps need it live)
        id: smoke_server
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/release')
        run: |
          server="${CLIPA_SERVER:-https://apprentice.exe.xyz}"
          code="$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "$server" || echo 000)"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          if [ "$code" = "000" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Smoke test skipped::$server did not answer (curl status 000: no connection). Skipping the live smoke test; this does not fail the build."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # The built app talks to the live Clipa server with its own code (session, conductor events and cues, one
      # synthetic frame, the voice handshake, the hand-over). Pull requests never call the server.
      - name: Smoke test against the Clipa server (release pushes, manual runs)
        if: steps.smoke_server.outputs.available == 'true'
        timeout-minutes: 3
        run: build/Clipa.app/Contents/MacOS/Clipa --smoke

      # Informative only: CI Macs may have no audio output device.
      - name: Smoke test with audio playback (release pushes, manual runs, informative)
        if: steps.smoke_server.outputs.available == 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: build/Clipa.app/Contents/MacOS/Clipa --smoke-audio
