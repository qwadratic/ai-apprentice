name: macos-build

on:
  push:
    paths:
      - "mac/**"
      - ".github/workflows/macos-build.yml"
  pull_request:
    paths:
      - "mac/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Build Clipa.app (release, ad-hoc signed)
        run: ./scripts/build-app.sh

      - name: Zip the app
        run: ditto -c -k --keepParent build/Clipa.app build/Clipa-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clipa-macos
          path: mac/build/Clipa-macos.zip
          if-no-files-found: error

      # Pushes to main publish the app as one fixed public release, so the download link never changes:
      # https://github.com/qwadratic/clipa/releases/download/clipa-macos-latest/Clipa-macos.zip
      - name: Publish the latest main build as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete clipa-macos-latest --yes --cleanup-tag || true
          gh release create clipa-macos-latest build/Clipa-macos.zip \
            --title "Clipa for macOS (latest main build)" --target "$GITHUB_SHA" \
            --notes "Ad-hoc signed build of mac/ at $GITHUB_SHA. Unzip it, run: xattr -dr com.apple.quarantine Clipa.app, then open Clipa.app and grant Screen Recording, Microphone and Input Monitoring."

      # Manual runs only: the built app talks to the live Clipa server with its own code (session, conductor events and
      # cues, one synthetic frame, the voice handshake, the hand-over). Pushes never call the server.
      - name: Smoke test against the Clipa server (manual runs)
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 3
        run: build/Clipa.app/Contents/MacOS/Clipa --smoke

      # Informative only: CI Macs may have no audio output device.
      - name: Smoke test with audio playback (manual runs, informative)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 3
        run: build/Clipa.app/Contents/MacOS/Clipa --smoke-audio
