name: release

# Push to main: re-run every check on the merged result; if green and not frozen, build the
# site and publish it to GitHub Pages together with deploy.json:
#   {"sha": "<40-hex target commit>", "at": "<UTC ISO time>", "run": "<this run's url>"}
# Site and pointer are one Pages artifact, so they always move together. The VM (TASK-6.2)
# polls <pages-url>/deploy.json, checks the sha is an ancestor of origin/main and deploys it.
# Nothing here pushes to git (no deploy branch) and nothing talks to the VM, so the workflow
# needs no contents: write.
#
# Stale runs: prepare skips a non-manual run whose commit is no longer the newest releasable
# state of main. If main moves while a run is already past prepare, its first attempt still
# finishes (Pages and the VM together); the newer run waits in the release concurrency group and
# then moves both. A re-run (attempt > 1) of a superseded run fails in every publishing job
# (RELEASE_GUARD), so re-running an old run never rolls the site or the API back.
# "Newest" ignores backlog/**: those pushes do not start this workflow (paths-ignore), so
# a code push followed at once by a backlog bookkeeping push still publishes the code push.
#
# Manual run (workflow_dispatch, must be started from main):
#   sha      commit on main to release (default: head of main). Rollback = an older sha;
#            it must be an ancestor of main. Skips the stale check.
#   confirm  release even though the repository variable DEPLOY_FREEZE is 1.
#
# Freeze: DEPLOY_FREEZE=1 blocks publishing (site and deploy.json) for pushes, and for manual
# runs unless confirm=true. A rollback should be combined with the freeze: set DEPLOY_FREEZE=1
# first (so the next push to main does not publish a newer commit over the rollback), then run
# the rollback manually with confirm=true. Unset the variable to resume.
on:
  push:
    branches: [main]
    # Backlog-only pushes (task bookkeeping) must not publish.
    paths-ignore:
      - "backlog/**"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on main to release (empty = head of main). An older sha is a rollback."
        type: string
        required: false
        default: ""
      confirm:
        description: Release even though DEPLOY_FREEZE is 1
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Run by pages-build, pages-deploy and deploy-vm, each on a full checkout: "Re-run failed jobs"
  # reuses the outputs of jobs that passed and skips their steps, so every publishing job checks
  # again. Needs SHA, EVENT, ATTEMPT, FREEZE and CONFIRM in the step's env.
  RELEASE_GUARD: |
    if [ "$FREEZE" = "1" ] && ! { [ "$EVENT" = "workflow_dispatch" ] && [ "$CONFIRM" = "true" ]; }; then
      echo "::error::DEPLOY_FREEZE=1: not releasing $SHA."
      exit 1
    fi
    if [ "$EVENT" = "workflow_dispatch" ]; then exit 0; fi
    git fetch --quiet origin main
    head=$(git rev-parse origin/main)
    if [ "$SHA" = "$head" ]; then exit 0; fi
    if ! git merge-base --is-ancestor "$SHA" "$head"; then
      echo "::error::$SHA is no longer on main ($head); refusing to release it."
      exit 1
    fi
    if git diff --quiet "$SHA" "$head" -- . ':(exclude)backlog'; then exit 0; fi
    if [ "$ATTEMPT" = "1" ]; then
      echo "::notice::main moved to $head during this run; releasing $SHA now, and the newer run releases over it."
      exit 0
    fi
    echo "::error::$SHA is no longer the head of main ($head); a re-run must not release an older commit. Use a manual run for a rollback."
    exit 1

jobs:
  prepare:
    name: resolve target commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: resolve
        env:
          INPUT_SHA: ${{ inputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (selected: $GITHUB_REF). Only commits on main can be released."
            exit 1
          fi
          target="${INPUT_SHA:-$GITHUB_SHA}"
          if ! printf '%s' "$target" | grep -Eq '^[0-9a-fA-F]{7,40}$'; then
            echo "::error::sha input must be 7-40 hex characters"
            exit 1
          fi
          git fetch --quiet origin main
          sha=$(git rev-parse --verify "${target}^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main; refusing to release it"
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && ! git cat-file -e "$sha:infra/ops/server.ts" 2>/dev/null; then
            echo "::error::$sha predates the deploy webhook (no infra/ops), so the VM cannot be moved to it. Pick a commit after the webhook merge."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "workflow_dispatch" ]; then
            head=$(git rev-parse origin/main)
            # Stale = main has moved on with changes outside backlog/ (those start their own run).
            if [ "$sha" != "$head" ] && ! git diff --quiet "$sha" "$head" -- . ':(exclude)backlog'; then
              echo "::notice::Skipping: $sha is no longer the head of main ($head); a newer run publishes that. Use a manual run to release an older commit."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Releasing $sha"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  gate:
    name: deploy freeze gate
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          FREEZE: ${{ vars.DEPLOY_FREEZE }}
          EVENT: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$FREEZE" != "1" ]; then
            echo "No freeze."
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$CONFIRM" = "true" ]; then
            echo "::warning::DEPLOY_FREEZE=1 overridden by a manual run with confirm."
            exit 0
          fi
          echo "::error::DEPLOY_FREEZE=1: deploy is frozen. Unset the variable, or run this workflow manually with confirm=true."
          exit 1

  checks-stream-b:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/stream-b-checks.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  checks-backlog:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/backlog-check.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  # Root workspace (stream A's web and API, stream B's packages): npm ci + npm run check on Node 22.22 and 24.
  checks-workspace:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/workspace-checks.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  pages-build:
    name: build site and deploy.json
    needs: [prepare, gate, checks-stream-b, checks-backlog, checks-workspace]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages
    env:
      # The one directory that is published: the launch page at its root, the web app (stream A + B) under app/
      # and deploy.json at the root (the VM's DEPLOY_SOURCE=pages mode reads <pages>/deploy.json).
      SITE_DIR: _site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Not frozen, and still the newest releasable commit
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          FREEZE: ${{ vars.DEPLOY_FREEZE }}
          CONFIRM: ${{ inputs.confirm }}
        run: bash -euo pipefail -c "$RELEASE_GUARD"
      # Every releasable commit is after the webhook merge (prepare refuses older ones), so both the root
      # workspace and the launch page exist.
      - name: Root workspace and launch page exist at this commit
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          for f in package-lock.json apps/web/package.json apps/web/features/agent/launchpad/package-lock.json; do
            [ -f "$f" ] || { echo "::error::$f is missing at $SHA; this commit cannot be published."; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/features/agent/launchpad/package-lock.json
      - name: Build the web app (stream A scaffold + stream B shell) for Pages
        env:
          WEB_BASE_PATH: /ai-apprentice/app/
          VITE_API_BASE: https://apprentice.exe.xyz
        run: |
          set -euo pipefail
          npm ci
          npm run build --workspace @apprentice/contracts
          npm run build --workspace @apprentice/web
      - name: Build the launch page (tsc to dist/)
        working-directory: apps/web/features/agent/launchpad
        run: |
          npm ci
          npm run typecheck
          npm run build
      # The web app stays under app/ until the product shell replaces A's debug view (A asked not to put a
      # mock-only scaffold at the public root); then the two swap places.
      - name: Assemble the site (launch page at the root, web app under app/)
        run: |
          set -euo pipefail
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR/app"
          cp -R apps/web/features/agent/launchpad/dist/. "$SITE_DIR/"
          cp -R apps/web/dist/. "$SITE_DIR/app/"
          find "$SITE_DIR" -type f | sort
      # Anthropic keys, ElevenLabs keys (sk_ + hex) and any api-key/xi-api-key assignment of a long literal.
      # A bare "api-key" grep would flag the app's own header-redaction code, so only assigned values count.
      # grep exits 1 on no match; 0 (a match) and 2 (an error, e.g. a PCRE limit) both fail the job.
      # The step runs under bash -e, so grep's status is caught with ||. -R follows symlinks (the Pages
      # artifact dereferences them) and -a scans files with NUL bytes too.
      - name: The published site carries no key-shaped values
        run: |
          set -uo pipefail
          rc=0
          grep -RalP 'sk-ant-[\w-]{20,}|sk_[a-fA-F0-9]{40,}|(?i:api[_-]?key|xi-api-key|elevenlabs_api_key)["\x27]?\s*[:=]\s*["\x27][\w-]{20,}' "$SITE_DIR" || rc=$?
          if [ $rc -eq 1 ]; then echo "No key-shaped values in $SITE_DIR"; exit 0; fi
          if [ $rc -eq 0 ]; then echo "::error::A key-shaped value is in the published site (files above)"; else echo "::error::The key scan failed (grep exit $rc)"; fi
          exit 1
      - name: Write deploy.json at the site root
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          out="$SITE_DIR/deploy.json"
          jq -n --arg sha "$SHA" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run "$RUN_URL" \
            '{sha: $sha, at: $at, run: $run}' > "$out"
          cat "$out"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  pages-deploy:
    name: publish to Pages
    needs: [prepare, pages-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages takes the run's artifact from any attempt, so a re-run of only this job would
      # publish an older build; the guard must run here too.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Not frozen, and still the newest releasable commit
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          FREEZE: ${{ vars.DEPLOY_FREEZE }}
          CONFIRM: ${{ inputs.confirm }}
        run: bash -euo pipefail -c "$RELEASE_GUARD"
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-vm:
    name: deploy API to the exe.dev VM
    # Runs after the site and deploy.json are published, so the web app and the API move together.
    # The VM verifies the HMAC, the timestamp and that the sha is on main, then deploys it with its own
    # build, health check and rollback (infra/deploy). This job waits for the result and fails if the
    # VM rolled back, so every backend deploy is visible here.
    needs: [prepare, pages-deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      API: https://apprentice.exe.xyz
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Not frozen, and still the newest releasable commit
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          FREEZE: ${{ vars.DEPLOY_FREEZE }}
          CONFIRM: ${{ inputs.confirm }}
        run: bash -euo pipefail -c "$RELEASE_GUARD"
      - name: Request the deploy
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_WEBHOOK_SECRET}" ]; then
            echo "::error::DEPLOY_WEBHOOK_SECRET is not set; the API cannot be deployed."
            exit 1
          fi
          body=$(jq -cn --arg sha "$SHA" --argjson ts "$(date +%s)" '{sha: $sha, ts: $ts}')
          # The secret stays in the environment, never in a command line.
          sig=$(BODY="$body" node -e 'process.stdout.write(require("crypto").createHmac("sha256", process.env.DEPLOY_WEBHOOK_SECRET).update(process.env.BODY).digest("hex"))')
          # octet-stream: a JSON body parser in front of /ops must leave the signed bytes untouched.
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 30 -X POST "$API/ops/deploy" \
            -H 'Content-Type: application/octet-stream' -H "X-Deploy-Signature: sha256=$sig" --data-raw "$body")
          cat response.json; echo
          if [ "$code" != "202" ] && [ "$code" != "200" ]; then
            echo "::error::The VM refused the deploy request (HTTP $code)."
            exit 1
          fi
      - name: Wait for the VM to finish
        run: |
          set -euo pipefail
          for i in $(seq 1 72); do
            # A restarting API may answer 502 or an HTML page: treat anything that is not a JSON object as "no news yet".
            status=$(curl -fsS --max-time 10 "$API/ops/deploy/status" 2>/dev/null) || status='{}'
            printf '%s' "$status" | jq -e 'type == "object"' >/dev/null 2>&1 || status='{}'
            last_sha=$(printf '%s' "$status" | jq -r '.last.sha // empty')
            state=$(printf '%s' "$status" | jq -r '.last.state // empty')
            deployed=$(printf '%s' "$status" | jq -r '.deployed_sha // empty')
            echo "$(date -u +%H:%M:%S) state=${state:-?} last=${last_sha:0:12} deployed=${deployed:0:12}"
            if [ "$last_sha" = "$SHA" ]; then
              case "$state" in
                ok) echo "Deployed $SHA"; printf '%s\n' "$status" | jq .; exit 0 ;;
                failed|rolled_back) printf '%s\n' "$status" | jq .; echo "::error::The VM could not deploy $SHA ($state)."; exit 1 ;;
              esac
            fi
            sleep 5
          done
          echo "::error::Timed out after 6 minutes waiting for the VM to deploy $SHA."
          exit 1
      - name: Health after deploy
        run: curl -fsS --max-time 10 "$API/health" | jq .
