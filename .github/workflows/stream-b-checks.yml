name: stream-b-checks

# Runs on PRs (path-filtered), and is reused by release.yml on main via workflow_call.
# Pushes to main are covered by release.yml, so the push trigger ignores main and deploy.
on:
  push:
    branches-ignore: [main]
    paths:
      - "packages/agent/**"
      - "fixtures/agent/**"
      - "apps/api/agent/**"
      - "apps/web/features/agent/**"
      - "apps/web/features/agent/launchpad/**"
      - ".github/workflows/stream-b-checks.yml"
  pull_request:
    paths:
      - "packages/agent/**"
      - "fixtures/agent/**"
      - "apps/api/agent/**"
      - "apps/web/features/agent/**"
      - "apps/web/features/agent/launchpad/**"
      - ".github/workflows/stream-b-checks.yml"
  workflow_call:
    inputs:
      ref:
        description: "Commit to check (default is the triggering commit)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Type-check every package that has a lockfile
        run: |
          set -euo pipefail
          for dir in packages/agent apps/api/agent/elevenlabs apps/web/features/agent/launchpad apps/web/features/agent/clipa; do
            if [ -f "$dir/package-lock.json" ]; then
              echo "::group::typecheck $dir"
              (cd "$dir" && npm ci && npm run typecheck)
              echo "::endgroup::"
            else
              echo "::notice::skipping $dir (no package-lock.json yet)"
            fi
          done

      - name: Agent package tests
        run: |
          set -euo pipefail
          cd packages/agent
          if [ -f package-lock.json ]; then npm ci; fi
          npm test

      # The launch page does not exist at commits before it; release.yml may check such a commit for a rollback,
      # so test for the lockfile before changing into the directory.
      - name: Launch page build
        run: |
          set -euo pipefail
          dir=apps/web/features/agent/launchpad
          if [ -f "$dir/package-lock.json" ]; then
            cd "$dir"
            npm ci
            npm run build
          else
            echo "::notice::skipping launch page build (no package-lock.json yet)"
          fi

      - name: Clipa motion tests and build
        run: |
          set -euo pipefail
          dir=apps/web/features/agent/clipa
          if [ -f "$dir/package-lock.json" ]; then
            cd "$dir"
            npm ci
            npm test
            npm run build
          else
            echo "::notice::skipping Clipa motion (no package-lock.json yet)"
          fi
