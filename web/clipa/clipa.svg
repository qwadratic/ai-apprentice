<?xml version="1.0" encoding="UTF-8"?>
<!--
  Clipa, the AI Apprentice mascot. Master art, idle pose.
  One chunky wire, 12 units thick: a round head loop (centre 60,48, radius 30), a smaller bend
  nested at the bottom right (centre 78,98, radius 12), two soft ends. Below the shoulder (30,60)
  the left leg is the arm that clipa.js and BuddyView.swift raise for "warning" and "pointing".
  Layers: face plate, wire outline, wire body, shade, highlight, face.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 4 96 120" width="192" height="240" role="img" aria-labelledby="clipa-title">
  <title id="clipa-title">Clipa</title>
  <defs>
    <filter id="clipa-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#03201d" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#03201d" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#clipa-shadow)">
    <circle cx="60" cy="48" r="25" fill="#f1fbf9"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M66 84V98A12 12 0 0 0 90 98V48A30 30 0 0 0 30 48V102" stroke="#0b5d56" stroke-width="15.6"/>
      <circle cx="30" cy="102" r="9" fill="#0b5d56"/>
      <path d="M66 84V98A12 12 0 0 0 90 98V48A30 30 0 0 0 30 48V102" stroke="#17b3a3" stroke-width="12"/>
      <circle cx="30" cy="102" r="7.2" fill="#17b3a3"/>
      <path d="M66 84V98A12 12 0 0 0 90 98V48A30 30 0 0 0 30 48V102" stroke="#0f9585" stroke-width="5" transform="translate(1.6 1.8)"/>
      <path d="M66 84V98A12 12 0 0 0 90 98V48A30 30 0 0 0 30 48V102" stroke="#a3f2e7" stroke-width="2.8" opacity="0.8" transform="translate(-2.2 -2.2)"/>
    </g>
    <g fill="#ff8a73" opacity="0.3">
      <ellipse cx="43.5" cy="57" rx="4.2" ry="2.5"/>
      <ellipse cx="76.5" cy="57" rx="4.2" ry="2.5"/>
    </g>
    <g fill="#0f2d2a">
      <circle cx="49.5" cy="47" r="4.3"/>
      <circle cx="70.5" cy="47" r="4.3"/>
    </g>
    <path d="M54.8 58.1Q60 63.3 65.2 58.1" fill="none" stroke="#0f2d2a" stroke-width="2.8" stroke-linecap="round"/>
  </g>
</svg>
