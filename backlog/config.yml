project_name: "AI Apprentice"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: ["stream-a", "stream-b", "shared", "contract", "screen", "vision", "workspace", "voice", "policy", "session", "workmap", "ux", "tutor", "demo", "infra", "pitch", "mac"]
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
definition_of_done:
  - "Acceptance criteria checked, final summary says what changed and how it was verified"
  - "Fast checks of the touched package pass; CI is green on the branch head"
  - "No secrets, keys or real personal data in the diff"
